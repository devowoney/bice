[project]
name = "bice"
version = "0.1.0"
description = "ML-4DVar ocean forecast optimization with frozen pretrained model (glonet v1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML/Scientific
    "numpy>=1.24.0",
    "xarray>=2023.1.0",
    "scipy>=1.10.0",
    # Data handling
    "xesmf>=0.8.0",
    "pandas>=2.0.0",
    "netCDF4>=1.6.0",
    "dask>=2023.1.0",
    # Configuration & experiment tracking
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.12.0",
    # Visualization & utilities
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    # SLURM integration
    "submitit>=1.5.0",
    "ipykernel>=7.3.0",
    # torch
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipython>=8.12.0",
    "pytest>=7.3.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true